name: "CI: webgl-preview"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag to publish"
        required: false
        type: string

env:
  TENCENT_REGISTRY: hkccr.ccs.tencentyun.com
  TENCENT_IMAGE_NAME: plugins/webgl-preview

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore Unity WebGL build assets
        env:
          WEBGL_BUILD_ASSET_BASE: https://webgl-preview-d.plugins.xrugc.com/Build
        run: |
          set -euo pipefail
          mkdir -p public/Build
          for file in public.data.gz public.framework.js.gz public.wasm.gz; do
            curl -fL --retry 5 --retry-delay 3 \
              "$WEBGL_BUILD_ASSET_BASE/$file" \
              -o "public/Build/$file"
            test -s "public/Build/$file"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore Unity WebGL build assets
        env:
          WEBGL_BUILD_ASSET_BASE: https://webgl-preview-d.plugins.xrugc.com/Build
        run: |
          set -euo pipefail
          mkdir -p public/Build
          for file in public.data.gz public.framework.js.gz public.wasm.gz; do
            curl -fL --retry 5 --retry-delay 3 \
              "$WEBGL_BUILD_ASSET_BASE/$file" \
              -o "public/Build/$file"
            test -s "public/Build/$file"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=webgl-preview,enable=${{ github.ref == 'refs/heads/webgl-preview' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=publish,enable=${{ github.ref == 'refs/heads/publish' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/publish' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
