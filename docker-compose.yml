services:
  webgl-preview:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBGL_PREVIEW_BASE_IMAGE: ${WEBGL_PREVIEW_BASE_IMAGE:-hkccr.ccs.tencentyun.com/plugins/webgl-preview@sha256:99b2cbbf35d369eea1cabf4a545e3d2e62d64e0810dbd680116c3ab35b1fa983}
        REQUIRE_PINNED_BASE_IMAGE: ${REQUIRE_PINNED_BASE_IMAGE:-0}
        REQUIRE_APPROVED_BUILD: ${REQUIRE_APPROVED_BUILD:-0}
    ports:
      - '127.0.0.1:3006:80'
    environment:
      HOST_API_BASE: ${HOST_API_BASE:-https://d.dev.xrugc.com}
      REQUIRE_TRUSTED_HOST_ORIGINS: ${REQUIRE_TRUSTED_HOST_ORIGINS:-1}
      TRUSTED_HOST_ORIGINS_JSON: '${WEBGL_PREVIEW_TRUSTED_HOST_ORIGINS_JSON:-["https://d.dev.xrugc.com"]}'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
