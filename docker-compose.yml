services:
  webgl-preview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3006:80'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
