      function estimateWebPreviewRuntimeProgress() {
        if (!webPreviewRuntimeProgressStartedAt) {
          return 2;
        }
        var elapsedSeconds = Math.max(
          0,
          (performance.now() - webPreviewRuntimeProgressStartedAt) / 1000
        );
        return Math.min(
          94,
          Math.max(2, Math.round(2 + 92 * (1 - Math.exp(-elapsedSeconds / 18))))
        );
      }

      function updateWebPreviewRuntimeProgress(actualPercent) {
        if (typeof actualPercent === "number" && isFinite(actualPercent)) {
          webPreviewRuntimeProgressActual = Math.max(
            webPreviewRuntimeProgressActual,
            Math.max(0, Math.min(100, Math.round(actualPercent)))
          );
        }

        var percent = Math.max(
          webPreviewRuntimeProgressDisplayed,
          webPreviewRuntimeProgressActual,
          estimateWebPreviewRuntimeProgress()
        );
        webPreviewRuntimeProgressDisplayed = percent;
        document.querySelector("#unity-progress-bar-full").style.width = percent + "%";
        setWebPreviewLoading(
          true,
          webPreviewT("loadingRuntimePercent", { percent: percent }),
          webPreviewT("loadingPlugin")
        );
      }

      function startWebPreviewRuntimeProgress() {
        stopWebPreviewRuntimeProgress();
        webPreviewRuntimeProgressStartedAt = performance.now();
        webPreviewRuntimeProgressActual = 0;
        webPreviewRuntimeProgressDisplayed = 0;
        updateWebPreviewRuntimeProgress(2);
        webPreviewRuntimeProgressTimer = window.setInterval(function() {
          updateWebPreviewRuntimeProgress();
        }, 500);
      }

      function stopWebPreviewRuntimeProgress() {

      function warmWebPreviewCache() {
        if (["localhost", "127.0.0.1", "::1"].indexOf(window.location.hostname) !== -1) {
          return Promise.resolve();
        }

        if (!("serviceWorker" in navigator)) {
          return Promise.resolve();
        }

        function cachePercent(completed, total) {
          if (!total) {
            return "0%";
          }
          return Math.max(0, Math.min(100, Math.round((completed / total) * 100))) + "%";
        }

        function waitForController() {
          if (navigator.serviceWorker.controller) {
            return Promise.resolve(navigator.serviceWorker.controller);
          }

          return new Promise(function(resolve) {
            var timeout = window.setTimeout(function() {
              navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
              resolve(navigator.serviceWorker.controller || null);
            }, 3000);

            function onControllerChange() {
              window.clearTimeout(timeout);
              navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
              resolve(navigator.serviceWorker.controller || null);
            }

            navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);
          });
        }

        return new Promise(function(resolve) {
          var settled = false;
          var cacheController = null;
          var startupTimer = window.setTimeout(function() {
            if (cacheController) {
              cacheController.postMessage({
                type: "cancel-webgl-preview-cache"
              });
            }
            webPreviewCacheActive = false;
            console.warn("[WebPreview] Cache warm timed out. Starting Unity directly.");
            settle();
          }, webPreviewCacheStartupTimeoutMs);

          function settle() {
            if (settled) {
              return;
            }
            settled = true;
            window.clearTimeout(startupTimer);
            navigator.serviceWorker.removeEventListener("message", onMessage);
            resolve();
          }

          function onMessage(event) {
            var message = event.data || {};
            if (message.type !== "webgl-preview-cache-status") {
              return;
            }

            postCacheStatusToParent(message);
            if (
              message.status === "started" ||
              message.status === "fetching" ||
              message.status === "progress"
            ) {
              webPreviewCacheActive = true;
              var completed = Number(message.completed || 0);
              var total = Number(message.total || 0);
              var path = message.path ? "：" + message.path : "";
              var action = message.reused ? webPreviewT("cacheReuse") : webPreviewT("cachePrepare");
              setWebPreviewLoading(
                true,
                webPreviewT("cacheDetail", {
                  percent: cachePercent(completed, total),
                  action: action,
                  completed: completed,
                  total: total,
                  path: path
                }),
                webPreviewT("cachePlugin")
              );
            }

            if (message.status === "complete" || message.status === "cancelled") {
              webPreviewCacheActive = false;
              settle();
              if (webPreviewUnityReady) {
                setWebPreviewLoading(false);
              }
            }

            if (message.status === "error") {
              webPreviewCacheActive = false;
              console.warn("[WebPreview] Service worker cache warm failed.", message.message);
              settle();
            }
          }

          navigator.serviceWorker.addEventListener("message", onMessage);

          navigator.serviceWorker.register(new URL("sw.js", window.location.href).toString(), {
            scope: new URL(".", window.location.href).toString(),
            updateViaCache: "none"
          }).then(function() {
            return navigator.serviceWorker.ready;
          }).then(waitForController).then(function(controller) {
            if (!controller) {
              settle();
              return;
            }
            cacheController = controller;
            controller.postMessage({
              type: "warm-webgl-preview-cache"
            });
          }).catch(function(error) {
            console.warn("[WebPreview] Service worker cache registration failed.", error);
            settle();
          });
        });
      }

      (function installWebPreviewRequestUrlGuard() {
        var guardKey = "__xrugcWebPreviewRequestUrlGuardInstalled";
        if (window[guardKey]) {
          return;
        }

        window[guardKey] = true;

        function normalizePreviewRequestUrl(url) {
          if (typeof url !== "string") {
            return url;
          }

          var normalized = url.replace(/\\\//g, "/");
          try {
            var parsed = new URL(normalized, window.location.href);
            if (
              parsed.protocol === "https:" &&
              (parsed.hostname === "127.0.0.1" || parsed.hostname === "localhost") &&
              parsed.pathname === "/__xrugc_proxy__"
            ) {
              var host = parsed.host || window.location.host || "127.0.0.1:8080";
              if (host === "localhost:8080") {

              var fixedUrl = "http://" + host + parsed.pathname + parsed.search + parsed.hash;
              console.warn("[WebPreview] Fixed local proxy request protocol:", url, "->", fixedUrl);
              return fixedUrl;
            }
          } catch (error) {
            return url;
          }

          return url;
        }

        var originalFetch = window.fetch;
        if (typeof originalFetch === "function") {
          window.fetch = function(input, init) {
            if (typeof input === "string") {
              return originalFetch.call(this, normalizePreviewRequestUrl(input), init);
            }

            if (typeof Request !== "undefined" && input instanceof Request) {
              var fixedRequestUrl = normalizePreviewRequestUrl(input.url);
              if (fixedRequestUrl !== input.url) {
                return originalFetch.call(this, new Request(fixedRequestUrl, input), init);
              }
            }

            return originalFetch.call(this, input, init);
          };
        }

        if (window.XMLHttpRequest && window.XMLHttpRequest.prototype.open) {
          var originalOpen = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(method, url) {
            var args = Array.prototype.slice.call(arguments);

            return originalOpen.apply(this, args);

        }

        if (window.HTMLMediaElement) {
          var mediaSrcDescriptor = Object.getOwnPropertyDescriptor(
            window.HTMLMediaElement.prototype,
            "src"

          if (mediaSrcDescriptor && typeof mediaSrcDescriptor.set === "function") {
            Object.defineProperty(window.HTMLMediaElement.prototype, "src", {
              configurable: true,
              enumerable: mediaSrcDescriptor.enumerable,
              get: mediaSrcDescriptor.get,
              set: function(value) {
                return mediaSrcDescriptor.set.call(this, normalizePreviewRequestUrl(value));
              },
            });
          }

          var originalMediaSetAttribute = window.HTMLMediaElement.prototype.setAttribute;
          window.HTMLMediaElement.prototype.setAttribute = function(name, value) {
            if (String(name).toLowerCase() === "src") {
              return originalMediaSetAttribute.call(
                this,
                name,
                normalizePreviewRequestUrl(value)
              );
            }
            return originalMediaSetAttribute.call(this, name, value);
          };
        }
      })();

      function createWebPreviewBridge(unityInstance) {
        var VIDEO_PATH_RE = /\.(?:mp4|webm)(?:[?#]|$)/i;
        function toSceneJson(payload) {
          if (typeof payload === "string") {
            logScenePayloadSummary(parseScenePayloadForSummary(payload));
            return payload;
          }

          try {
            var preparedPayload = prepareScenePayload(payload || {});
            logScenePayloadSummary(preparedPayload);

            console.warn("[WebPreview] Failed to stringify scene payload.", error);

        function parseScenePayloadForSummary(payload) {
          try {

          } catch (error) {

          }
        }

        function prepareScenePayload(payload) {
          var copy = clonePayload(payload);
          rewriteRemoteUrls(copy);
          return copy;
        }

        function logScenePayloadSummary(payload) {
          if (!payload || typeof payload !== "object") {
            return;
          }

          var scene = payload.scene && typeof payload.scene === "object" ? payload.scene : {};
          var script = payload.script && typeof payload.script === "object" ? payload.script : {};
          var metas = Array.isArray(payload.metas) ? payload.metas : [];
          var lua = readFirstString(script.lua, payload.code, scene.code);
          var metaSummaries = metas.slice(0, 12).map(function(meta, index) {
            var code = readFirstString(meta && meta.code, meta && meta.script);
            return {
              index: index,
              id: meta && meta.id,
              title: meta && (meta.title || meta.name),
              codeLength: code.length,
              actions: extractLuaActions(code)
            };
          });

          console.log("[WebPreview][Payload] scene", {
            sceneId: scene.id || payload.sceneId || payload.id,
            sceneName: scene.name || payload.title || payload.name,
            metas: metas.length,
            resources: Array.isArray(payload.resources) ? payload.resources.length : 0,
            luaLength: lua.length,
            luaActions: extractLuaActions(lua),
            metaActions: metaSummaries
          });
        }

        function readFirstString() {
          for (var index = 0; index < arguments.length; index += 1) {
            if (typeof arguments[index] === "string") {
              return arguments[index];
            }
          }

          return "";
        }

        function extractLuaActions(code) {
          if (typeof code !== "string" || !code) {
            return [];
          }

          var actions = [];
          var actionRegex = /(?:meta|verse)\s*\[\s*["']([^"']+)["']\s*\]/g;
          var match;
          while ((match = actionRegex.exec(code)) !== null) {
            var action = match[1];
            if (!action || action === "@init" || action === "#init" || actions.indexOf(action) !== -1) {
              continue;
            }

            actions.push(action);
          }

          return actions;
        }

        function clonePayload(payload) {
          try {
            if (typeof structuredClone === "function") {
              return structuredClone(payload);
            }
          } catch (error) {
            console.warn("[WebPreview] structuredClone failed, falling back to JSON clone.", error);
          }

          return JSON.parse(JSON.stringify(payload));
        }

        function rewriteRemoteUrls(value) {
          if (!value || typeof value !== "object") {
            return;
          }

          if (Array.isArray(value)) {
            value.forEach(rewriteRemoteUrls);
            return;
          }

          Object.keys(value).forEach(function(key) {
            var item = value[key];
            if (typeof item === "string") {
              value[key] = rewriteStringValue(item);
              return;
            }

            rewriteRemoteUrls(item);
          });
        }

        function rewriteStringValue(value) {
          if (/^https?:\/\//i.test(value)) {
            return toProxyUrl(value);
          }

          var trimmed = value.trim();
          if ((trimmed.charAt(0) === "{" || trimmed.charAt(0) === "[") && trimmed.length >= 2) {
            try {
              var json = JSON.parse(value);
              rewriteRemoteUrls(json);
              return JSON.stringify(json);
            } catch (error) {
              return rewritePlainTextUrls(value);
            }
          }

          return rewritePlainTextUrls(value);
        }

        function rewritePlainTextUrls(value) {
          return value.replace(/https?:\\?\/\\?\/[^\s"'<>]+/gi, function(match) {
            return toProxyUrl(match.replace(/\\\//g, "/"));
          });
        }

        function shouldUseDirectCdnAssets() {
          var params = new URLSearchParams(window.location.search);
          var value = params.get("directCdn") || params.get("directCdnAssets") || params.get("assetMode");
          return /^(1|true|direct|cdn)$/i.test(String(value || ""));
        }

        function toProxyUrl(url) {
          if (!/^https?:\/\//i.test(url)) {
            return url;
          }

          var normalizedUrl = normalizeRemoteAssetUrl(url);
          try {
            var parsed = new URL(normalizedUrl);
            if (parsed.pathname === "/__xrugc_proxy__") {
              return getProxyOrigin() + parsed.pathname + parsed.search;
            }

            if (parsed.origin === window.location.origin) {
              return normalizedUrl;
            }

            if (shouldUseDirectCdnAssets() && parsed.hostname === "data.7dgame.com") {
              return parsed.toString();
            }
          } catch (error) {
            return url;
          }

          var proxyUrl = new URL(getProxiedAssetPath(normalizedUrl), getProxyOrigin());
          proxyUrl.searchParams.set("url", normalizedUrl);
          proxyUrl.searchParams.set("v", webPreviewBuildCacheVersion);
          return proxyUrl.toString();
        }

        function getProxiedAssetPath(url) {
          try {
            var parsed = new URL(normalizeRemoteAssetUrl(url));
            var extensionMatch = parsed.pathname.match(/\.([a-z0-9]+)$/i);
            return "/__xrugc_proxy__/asset" + (extensionMatch ? extensionMatch[0].toLowerCase() : "");
          } catch (error) {
            return "/__xrugc_proxy__";
          }
        }

        function normalizeVideoUrl(value) {
          try {
            var parsed = new URL(value.replace(/\\\//g, "/"));
            if (parsed.protocol === "http:") {
              parsed.protocol = "https:";
            }
            return parsed.toString();
          } catch (error) {
            return value;
          }
        }

        function normalizeRemoteAssetUrl(value) {
          try {
            var parsed = new URL(value.replace(/\\\//g, "/"));
            if (parsed.protocol === "http:") {
              parsed.protocol = "https:";
            }
            if (parsed.hostname === "7dgame-public-1251022382.cos.ap-nanjing.myqcloud.com") {
              parsed.protocol = "https:";
              parsed.hostname = "data.7dgame.com";
            }
            return parsed.toString();
          } catch (error) {
            return value;
          }
        }

        function getProxyOrigin() {
          var host = window.location.host || "127.0.0.1:8080";
          if (host === "localhost:8080") {
            host = "127.0.0.1:8080";
          }

          var protocol = window.location.protocol === "https:" ? "https:" : "http:";
          return protocol + "//" + host;
        }

        function forwardSceneJson(json, options) {
          try {
            unityInstance.SendMessage("WebPreviewBootstrap", "LoadSceneJson", json);
            if (!(options && options.quiet)) {
              console.log("[WebPreview] Forwarded scene json to Unity (" + json.length + " chars)");
            }

            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: "unity-web-preview-scene-forwarded",
                session: webPreviewSession,
                length: json.length
              }, "*");
            }

            return true;
          } catch (error) {
            console.error("[WebPreview] Failed to send scene json to Unity.", error);
            return false;
          }
        }

        function sendSceneJson(payload) {
          webPreviewSceneVisibleNotified = false;
          var json = toSceneJson(payload);
          forwardSceneJson(json);
        }

        function getMessagePayload(data) {
          if (Object.prototype.hasOwnProperty.call(data, "payload")) {
            return data.payload;
          }

          if (Object.prototype.hasOwnProperty.call(data, "scene")) {
            return data.scene;
          }

          if (Object.prototype.hasOwnProperty.call(data, "json")) {
            return data.json;
          }

          return {};
        }

        function readInitialScenePayload() {
          var params = new URLSearchParams(window.location.search);
          var scene = params.get("scene");

          if (!scene) {
            return {
              sceneId: "web-preview-smoke-test",
              title: "Web Preview Smoke Test",
              entities: [],
              scripts: [],
              source: "webgl-template"
            };
          }

          try {
            return JSON.parse(scene);
          } catch (error) {
            console.warn("[WebPreview] The scene query parameter is not valid JSON; forwarding it as raw text.", error);
            return {
              sceneId: "web-preview-query",
              rawScene: scene,
              source: "query-string"
            };
          }
        }

        var bridge = {
          unityInstance: unityInstance,
          sendSceneJson: sendSceneJson,
          ping: function(message) {
            unityInstance.SendMessage("WebPreviewBootstrap", "Ping", message || "");
          },
          setCameraMode: function(mode) {
            var nextMode = mode || "orbit";
            unityInstance.SendMessage("WebPreviewBootstrap", "SetCameraMode", nextMode);
            console.log("[WebPreview][CameraControl] forwarded camera mode " + nextMode);
          }
        };

        window.unityWebPreview = bridge;
        window.addEventListener("message", function(event) {
          var data = event.data || {};

          if (data.type === "load-scene-json" || data.type === "xrugc-load-scene-json") {
            sendSceneJson(getMessagePayload(data));
          }

          if (data.type === "unity-web-preview-ping") {
            bridge.ping(data.message || "");
          }

          if (data.type === "unity-web-preview-camera-mode") {
            bridge.setCameraMode(data.mode || "orbit");
          }
        });

        sendSceneJson(readInitialScenePayload(), { retry: false });

        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "unity-web-preview-ready",
            session: webPreviewSession,
            productName: "Web Preview",
            productVersion: "1.0.0"
          }, "*");
        }

        return bridge;
      }

      function startUnityWebPreview() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          startWebPreviewRuntimeProgress();
          createUnityInstance(canvas, config, (progress) => {
            updateWebPreviewRuntimeProgress(progress * 100);
                }).then((unityInstance) => {
                  stopWebPreviewRuntimeProgress();
                  document.querySelector("#unity-loading-bar").style.display = "none";
                  webPreviewUnityReady = true;
                  if (!webPreviewCacheActive) {
                    setWebPreviewLoading(false);
                  }
                  document.querySelector("#unity-fullscreen-button").onclick = () => {
                    unityInstance.SetFullscreen(1);
                  };

                  createWebPreviewBridge(unityInstance);

                }).catch((message) => {
                  stopWebPreviewRuntimeProgress();
                  alert(message);
                });
              };

        document.body.appendChild(script);
      }

      webPreviewCacheReady.then(startUnityWebPreview);

    </script>
  </body>
</html>
