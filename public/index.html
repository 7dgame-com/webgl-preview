<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WebGL</title>
    <link rel="stylesheet" href="./styles/plugin-runner.css?v=2026.05.18.8" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="WebGL 控制栏">
        <div class="controls">
          <label class="scene-field" for="scene-id" data-scene-field>
            <span>场景号</span>
            <input
              id="scene-id"
              class="scene-input"
              data-scene-id
              inputmode="numeric"
              autocomplete="off"
              placeholder="例如 1416"
            />
          </label>

          <button class="button button-primary" type="button" data-run>
            运行
          </button>
          <button class="button" type="button" data-stop hidden>
            停止
          </button>
          <button class="button" type="button" data-reload hidden>
            重跑
          </button>
        </div>

        <div class="topbar-meta">
          <div class="version" data-version>版本 -</div>
          <div class="status" data-status>待运行</div>
        </div>
      </header>

      <section class="viewer" aria-label="Unity WebGL 预览">
        <iframe
          class="preview-frame"
          title="Unity WebGL"
          data-frame
          allow="fullscreen; clipboard-read; clipboard-write"
        ></iframe>
        <div class="loading-shield" data-loading-shield>
          <div class="loading-panel" role="status" aria-live="polite">
            <div class="loading-title" data-loading-title>正在加载 WebGL 插件</div>
            <div class="loading-detail" data-loading-detail>
              正在准备 Unity 运行环境，请稍候。
            </div>
          </div>
        </div>
      </section>

      <section hidden aria-hidden="true">
        <span data-api-base></span>
        <span data-token-state></span>
        <input data-token-input />
        <button type="button" data-save-token></button>
        <span data-scene-name></span>
        <span data-resource-count></span>
        <span data-meta-count></span>
        <span data-lua-length></span>
        <pre data-log></pre>
      </section>
    </main>

    <script type="module" src="./modules/plugin-runner.js?v=2026.05.18.8"></script>
  </body>
</html>
