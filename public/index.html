<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WebGL</title>
    <link rel="stylesheet" href="./styles/plugin-runner.css?v=2026.05.19.15" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="WebGL 控制栏" data-i18n-aria-label="topbarLabel">
        <div class="controls">
          <label class="scene-field" for="scene-id" data-scene-field>
            <input
              id="scene-id"
              class="scene-input"
              data-scene-id
              inputmode="numeric"
              autocomplete="off"
              placeholder="请输入场景号：例如1416"
              data-i18n-placeholder="sceneIdPlaceholder"
            />
          </label>

          <button class="button button-primary" type="button" data-run>
            <span data-i18n="run">运行</span>
          </button>
          <button class="button" type="button" data-stop hidden>
            <span class="button-icon" aria-hidden="true">■</span>
            <span data-i18n="stop">停止</span>
          </button>
          <button class="button" type="button" data-reload hidden>
            <span class="button-icon" aria-hidden="true">↻</span>
            <span data-i18n="rerun">重跑</span>
          </button>
        </div>

        <div class="topbar-meta">
          <div class="version" data-version>版本 -</div>
        </div>
      </header>

      <section class="viewer" aria-label="Unity WebGL 预览" data-i18n-aria-label="viewerLabel">
        <iframe
          class="preview-frame"
          title="Unity WebGL"
          data-frame
          allow="fullscreen; clipboard-read; clipboard-write"
        ></iframe>
        <div class="idle-hint" data-idle-hint aria-hidden="true">
          <div class="idle-stack">
            <div class="status" data-status>待运行</div>
            <div class="idle-logo"></div>
            <div class="loading-progress" data-loading-progress hidden>
              <div class="loading-progress-track">
                <div class="loading-progress-bar" data-loading-progress-bar></div>
              </div>
              <div class="loading-progress-text" data-loading-progress-text>0%</div>
            </div>
          </div>
        </div>
        <div class="loading-shield" data-loading-shield>
          <div class="loading-panel sr-only" role="status" aria-live="polite">
            <div class="loading-title" data-loading-title>正在加载 WebGL 插件</div>
            <div class="loading-detail" data-loading-detail>
              正在准备 Unity 运行环境，请稍候。
            </div>
          </div>
        </div>
      </section>

      <section hidden aria-hidden="true">
        <span data-api-base></span>
        <span data-token-state></span>
        <input data-token-input />
        <button type="button" data-save-token></button>
        <span data-scene-name></span>
        <span data-resource-count></span>
        <span data-meta-count></span>
        <span data-lua-length></span>
        <pre data-log></pre>
      </section>
    </main>

    <script type="module" src="./modules/plugin-runner.js?v=2026.05.19.15"></script>
  </body>
</html>
