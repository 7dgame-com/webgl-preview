server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index embed.html index.html;

  add_header Cross-Origin-Embedder-Policy credentialless always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Access-Control-Allow-Origin "*" always;

  location = /api/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/manifest {
    default_type application/json;
    try_files /plugin/manifest.json =404;
  }

  location ~* \.wasm\.gz$ {
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /embed.html;
  }
}
