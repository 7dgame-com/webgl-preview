server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index embed.html index.html;

  add_header Cross-Origin-Embedder-Policy credentialless always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Access-Control-Allow-Origin "*" always;

  location = /api/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/manifest {
    default_type application/json;
    try_files /plugin/manifest.json =404;
  }

  location = /__xrugc_proxy__ {
    default_type application/json;

    if ($request_method = OPTIONS) {
      return 204;
    }

    if ($arg_url = "") {
      return 400 '{"success":false,"error":"Missing proxy url"}';
    }

    if ($arg_url !~* "^https?://") {
      return 400 '{"success":false,"error":"Only http and https proxy urls are supported"}';
    }

    resolver 119.29.29.29 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_intercept_errors off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Cross-Origin-Resource-Policy cross-origin always;

    proxy_pass $arg_url;
  }

  location ~* \.wasm\.gz$ {
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /embed.html;
  }
}
