server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html embed.html;

  include /etc/nginx/snippets/webgl-preview-security-headers.conf;

  set $webgl_immutable_cache "public, max-age=31536000, s-maxage=31536000, immutable";
  set $webgl_revalidate_cache "no-cache, must-revalidate";

  location = /health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /api/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/manifest {
    default_type application/json;
    try_files /plugin/manifest.json =404;
  }

  # Same-origin, fixed-surface Platform API alias. HOST_API_BASE is validated
  # before nginx's official entrypoint substitutes this template. Client input
  # can choose only query values; it can never choose the upstream or API path.
  location ~ ^/platform-api/v1/verses(?:/[1-9][0-9]*)?$ {
    limit_except GET {
      deny all;
    }

    rewrite ^/platform-api(/v1/verses(?:/[1-9][0-9]*)?)$ /api$1 break;

    proxy_pass ${HOST_API_BASE};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_intercept_errors on;

    # Forward the minimum request surface. In particular, browser Origin and
    # Cookie state must never cross this plugin-owned boundary.
    proxy_pass_request_headers off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Accept "application/json";
    proxy_set_header Authorization $http_authorization;

    # The alias is same-origin and memory-token based. Upstream session or CORS
    # headers are neither useful nor safe to reflect back to the plugin page.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Location;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    add_header Cache-Control "no-store" always;

    error_page 301 302 303 307 308 =502 @platform_api_redirect_denied;
  }

  # Extensionless unknown routes normally fall back to the Shell. Keep the
  # alias fail-closed so no other Platform API path can ever reach upstream.
  location = /platform-api {
    return 404;
  }

  location /platform-api/ {
    return 404;
  }

  location @platform_api_redirect_denied {
    # Internal redirects change nginx location context, so repeat no-store here
    # to avoid inheriting the server-level wildcard CORS headers.
    add_header Cache-Control "no-store" always;
    return 502;
  }

  # Removed security-sensitive compatibility endpoints must never fall through
  # to the SPA shell or be mistaken for a working proxy.
  location = /__xrugc_proxy__ {
    return 404;
  }

  location = /api/snapshot {
    return 404;
  }

  # This virtual route only exists inside a controlled Service Worker scope.
  # An uncontrolled request must never fall through to the SPA shell.
  location = /__xrugc_scene_resource__ {
    return 404;
  }

  location ~* \.wasm\.br$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location ~* \.js\.br$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location ~* \.data\.br$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location ~* \.wasm\.gz$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    try_files $uri =404;
  }

  location = /embed.html {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /sw.js {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    default_type application/javascript;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  # Imported Service Worker code participates in the update algorithm and
  # must revalidate with sw.js instead of being held by the one-year JS cache.
  location = /modules/sw-build-cache.js {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    default_type application/javascript;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /runtime-config.json {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /build-manifest.json {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    default_type application/json;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /artifact-compatibility.json {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    default_type application/json;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location ~* \.loader\.js$ {
    include /etc/nginx/snippets/webgl-preview-security-headers.conf;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  # Keep history-API fallback for extensionless client routes, while making
  # missing scripts, styles, manifests and media fail explicitly.
  location ~* \.[a-z0-9][a-z0-9.-]*$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
