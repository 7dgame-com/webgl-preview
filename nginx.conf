server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html embed.html;

  add_header Cross-Origin-Embedder-Policy credentialless always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Timing-Allow-Origin "*" always;

  set $webgl_immutable_cache "public, max-age=31536000, s-maxage=31536000, immutable";
  set $webgl_revalidate_cache "no-cache, must-revalidate";

  location = /health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /api/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/health {
    default_type application/json;
    return 200 '{"success":true,"data":{"status":"ok","plugin":"webgl-preview","publicDirExists":true}}';
  }

  location = /plugin/manifest {
    default_type application/json;
    try_files /plugin/manifest.json =404;
  }

  location = /api/snapshot {
    default_type application/json;

    if ($request_method = OPTIONS) {
      return 204;
    }

    resolver 119.29.29.29 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host a2.bujiaban.com;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_intercept_errors off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Timing-Allow-Origin "*" always;

    proxy_pass https://a2.bujiaban.com/v1/server/snapshot;
  }

  location ^~ /__xrugc_proxy__ {
    default_type application/json;

    if ($request_method = OPTIONS) {
      return 204;
    }

    if ($arg_url = "") {
      return 400 '{"success":false,"error":"Missing proxy url"}';
    }

    if ($arg_url !~* "^https?://") {
      return 400 '{"success":false,"error":"Only http and https proxy urls are supported"}';
    }

    resolver 119.29.29.29 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_force_ranges on;
    proxy_buffering off;
    proxy_intercept_errors off;
    gzip off;
    gunzip off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Content-Encoding;
    proxy_hide_header Content-MD5;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Range, If-Range, Content-Type" always;
    add_header Accept-Ranges "bytes" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Timing-Allow-Origin "*" always;

    proxy_pass $arg_url;
  }

  location ~* \.wasm\.br$ {
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.js\.br$ {
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.data\.br$ {
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding br always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.wasm\.gz$ {
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    gzip off;
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    add_header Cache-Control $webgl_immutable_cache always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location = /embed.html {
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location ~* \.loader\.js$ {
    add_header Cache-Control $webgl_revalidate_cache always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
